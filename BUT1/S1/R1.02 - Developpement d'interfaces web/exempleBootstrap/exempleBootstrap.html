<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="fr" lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Exemple de structure</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- définition d'un conteneur fluid -->
    <div class="container-fluid">
        <!-- Entête : 12 colonnes -->
        <div class="row">
            <div class="col-12">
                <h2>Entête</h2>
            </div>
        </div>

        <!-- Menu : 2 colonnes -->
        <div class="row">
            <div class="col-2">
                <h2>Menu</h2>
            </div>

            <!-- Main : 10 colonnes -->
            <div class="col-10">Main
                <!-- définition d'une ligne pour Article et Aside -->
                <div class="row">
                    <!-- Aside : 3 colonnes -->
                    <aside class="col-3">
                        <h2>Aside</h2>
                    </aside>

                    <!-- Article : 9 colonnes avec une hauteur spécifiée pour mieux visualiser -->
                    <article class="col-9">
                        <h2>Article</h2>
                        <p>Donec id elit non mi porta gravida at eget metus.</p>
                    </article>
                </div>
            </div>
        </div>

        <!-- Pied de page : 12 colonnes -->
        <div class="row">
            <div class="col-12">
                <h2>Pied de page</h2>
            </div>
        </div>
    </div>
</body>
</html>
