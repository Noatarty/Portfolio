// voir https://stackoverflow.com/a/65056488 (append if not exist)
d3.selection.prototype.appendIfAbsent = function(selector, type) {
  const element = this.select(selector)
  return element.empty() ? this.append(type) : element
}

// luminance d'une couleur, voir https://fr.wikipedia.org/wiki/Luminance
function getLuminance(color) {
  // composantes HSL, voir https://d3js.org/d3-color, L = luminance
  const hsl = d3.hsl(color)
  return hsl.l
}

const colors = d3.scaleOrdinal()

// ici, il y aura les scripts d3.js pour créer, modifier et animer l'image SVG (enlever ce commentaire)

    function HierarchicBoxes(unit_height=4) {
      // détermination de la position et la taille des rectangles
      function _prepareData(data, x=0, y0=0) {
      let maxwidth=0, maxheight=0, y=y0
      for (const d of data) {
        d.id = d.name
        d.x = x
        d.y = y
        // si data contient des enfants, alors les ranger aussi
        if (d.children !== undefined) {
          // ranger les éléments enfants
          const dimensions = _prepareData(d.children, x+1, y+unit_height)
          d.width  = dimensions.maxwidth + 2
          d.height = dimensions.maxheight + unit_height
        } else {
          // feuille
          d.width  = d.value
          d.height = unit_height
        }
          y += d.height
          if (d.width > maxwidth) maxwidth = d.width
        }
        maxheight = y - y0
        return {maxwidth, maxheight}
      }

      function _drawBoxes(parent, data) {
        // créer <g> dans parent
        const g = parent.append("g")
        // dessiner les rectangles dans g
        g.selectAll("rect")
          .data(data)
          .join("rect")
          .attr("x", d => d.x)
          .attr("y", d => d.y)
          .attr("width", d => d.width)
          .attr("height", d => d.height)
          .attr("fill", d => colors(d.id))
          .attr("stroke", "#222")
          .attr("stroke-width", 0.02)

        // dessiner les textes dans g
        g.selectAll("text")
          .data(data)
          .join("text")
          .text(d => d.name)
          .attr("x", d => d.x + d.width/2)
          .attr("y", d => d.y + d.height/2)
          .attr("text-anchor", "middle")
          .attr("dominant-baseline", "middle")
          .attr("fill", "#000")
          .attr("font-size", unit_height * 0.4)

        // appel récursif pour dessiner les données ayant des enfants
        for (const d of data) {
          if (d.children !== undefined) {
            _drawBoxes(g, d.children)
          }
        }
      }

      function _drawAll(svg, data) {
        // détermination de la position et la taille des rectangles
        const {maxwidth, maxheight} = _prepareData(data)
        const flattenCount = (arr) => arr.reduce((acc, it) => acc + (it.children ? flattenCount(it.children) : 1), 0)
        const total = flattenCount(data)
        colors.range(d3.quantize(d3.interpolateRainbow, Math.max(2, total + 1)))
        // définir la viewBox...
        svg.attr("viewBox", `-1 -1 ${maxwidth+2} ${maxheight+2}`)
        // dessiner les données
        _drawBoxes(svg, data)
      }

      function drawAll(selection) {
        selection.each(function(datum) {
          _drawAll(d3.select(this), datum)
        })
      }

      return drawAll
    }

    const dessin = d3.select("#dessin")
    const boxes = HierarchicBoxes()
    dessin.datum(data3).call(boxes)
